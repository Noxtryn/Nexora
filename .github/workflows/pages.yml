name: Publish Nexora website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nexora-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check website JavaScript
        run: |
          node --check app.js
          node --check pages-preview.js
          node --check review.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reviewed bot source
        run: |
          unzip -q nexora-source.zip -d /tmp/nexora-source
          cd /tmp/nexora-source/discord-bot
          python -m pip install -r requirements.txt -r requirements-dashboard.txt
          python -m unittest discover -s tests -t .
          python -m prisonsbot check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
